apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kelpford-production
  namespace: argocd
  annotations:
    argo.octopus.com/project: "update-manifests-demo"
    argo.octopus.com/environment: "production"  
spec:
  project: default
  source:
    repoURL: https://github.com/twerthi/octopus-demo-apps-kubernetes.git
    targetRevision: HEAD
    path: manifests/argocd/production
  destination:
    server: https://kubernetes.default.svc
    namespace: kelpford-production
  syncPolicy:
#    automated: 
#      prune: true
#      selfHeal: true
    syncOptions:
    - Validate=false
    - CreateNamespace=true