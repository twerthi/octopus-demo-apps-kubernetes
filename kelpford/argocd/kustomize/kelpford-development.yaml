apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kelpford-development
  namespace: argocd
  annotations:
    argo.octopus.com/project: "update-manifests-demo"
    argo.octopus.com/environment: "development"  
spec:
  project: default
  source:
    repoURL: https://github.com/twerthi/octopus-demo-apps-kubernetes.git
    targetRevision: HEAD
    path: kelpford/kustomize/argocd/overlays/development
  destination:
    server: https://kubernetes.default.svc
    namespace: kelpford-development
  syncPolicy:
#    automated: 
#      prune: true
#      selfHeal: true
    syncOptions:
    - Validate=false
    - CreateNamespace=true