apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kelpford-test
resources:
- ../../base

patches:
  - target:
      kind: Deployment
      name: kelpford-web-deployment
    path: kelpford-web-deployment.yaml
  - target:
      kind: Service
      name: kelpford-web-cluster-ip
    path: kelpford-web-service.yaml
  - target:
      kind: Deployment
      name: kelpford-api-deployment
    path: kelpford-api-deployment.yaml
  - target:
      kind: Service
      name: kelpford-api-cluster-ip
    path: kelpford-api-service.yaml

images:
  - name: twerthi/kelpford-web
    newName: #{Octopus.Action.Package[kelpford-web].PackageId}
    newTag: #{Octopus.Action.Package[kelpford-web].PackageVersion}
  - name: twerthi/kelpford-api
    newName: #{Octopus.Action.Package[kelpford-api].PackageId}
    newTag: #{Octopus.Action.Package[kelpford-api].PackageVersion}

